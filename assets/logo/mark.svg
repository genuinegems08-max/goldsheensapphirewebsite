<svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Gold Sheen Sapphire mark">
  <!-- Emerald-cut facet outline, referencing the octagonal step-cut typical of sapphire -->
  <polygon points="14,4 34,4 44,14 44,34 34,44 14,44 4,34 4,14" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
  <polygon points="18.2,12.4 29.8,12.4 35.6,18.2 35.6,29.8 29.8,35.6 18.2,35.6 12.4,29.8 12.4,18.2" stroke="currentColor" stroke-width="1" stroke-linejoin="round"/>

  <g stroke="currentColor" stroke-width="0.7" opacity="0.5">
    <line x1="14" y1="4" x2="18.2" y2="12.4"/>
    <line x1="34" y1="4" x2="29.8" y2="12.4"/>
    <line x1="44" y1="14" x2="35.6" y2="18.2"/>
    <line x1="44" y1="34" x2="35.6" y2="29.8"/>
    <line x1="34" y1="44" x2="29.8" y2="35.6"/>
    <line x1="14" y1="44" x2="18.2" y2="35.6"/>
    <line x1="4" y1="34" x2="12.4" y2="29.8"/>
    <line x1="4" y1="14" x2="12.4" y2="18.2"/>
  </g>

  <!-- Rutile-needle sheen, drawn from the mine's own inclusion pattern -->
  <g stroke="currentColor" stroke-width="1.1" stroke-linecap="round" opacity="0.95">
    <line x1="19" y1="17" x2="27.5" y2="22.5"/>
    <line x1="22.5" y1="29.5" x2="30" y2="24.5"/>
    <line x1="17.5" y1="25.5" x2="23.5" y2="30.5"/>
  </g>
</svg>
